[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanillanet-ships"
version = "0.1.0"
description = "VanillaNet-7 reimplementation for grayscale ship classification, with inference-time layer fusion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Clément Castiglione" },
]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
