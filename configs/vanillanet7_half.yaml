# Half-width variant: every channel count is divided by two, same recipe as
# configs/vanillanet7.yaml. To compare the two models, set val_split: 0.2 in
# both files.
width: 0.5
num_epochs: 300
batch_size: 64
lr: 5.0e-4
weight_decay: 0.1
warmup_epochs: 5
min_lr: 1.0e-6
label_smoothing: 0.12
mixup_alpha: 0.2
cutmix_alpha: 1.0
grad_accum_steps: 2
grad_clip: 1.0
ema_decay: 0.999
deep_training_epochs: 200
val_split: 0.0
val_every: 10
patience: 14
seed: 0
num_workers: 4
